name: Clarity debug (temporary)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List available metrics + dimensions (names only, no values)
        env:
          TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          curl -s -w "\nHTTP=%{http_code}\n" -H "Authorization: Bearer $TOKEN" \
            "https://www.clarity.ms/export-data/api/v1/project-live-insights?numOfDays=3&dimension1=URL&dimension2=Device" \
          | python3 -c "
          import sys, json
          raw = sys.stdin.read()
          body, _, status = raw.rpartition('HTTP=')
          print('status:', status.strip())
          try:
              data = json.loads(body)
          except Exception:
              print('unparseable:', body[:200]); raise SystemExit(0)
          if isinstance(data, dict):
              print('API error:', json.dumps(data)[:200]); raise SystemExit(0)
          for m in data:
              name = m.get('metricName')
              info = m.get('information') or []
              keys = sorted({k for row in info[:5] for k in row.keys()})
              print(f'{name}: rows={len(info)} keys={keys}')
          "
